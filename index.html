<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひびノート</title>
<meta name="description" content="自分用のTodoと日記のノート">
<meta name="theme-color" content="#9cc58a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17221a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ひびノート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #9cc58a;
    --ink: #1f3220;
    --ink-soft: #2e4429;
    --paper: #fcfdf8;
    --paper-ink: #1f3220;
    --paper-soft: #556b50;
    --paper-line: #dde7d3;
    --note: #fff1a8;
    --note-fold: #e6d57c;
    --note-ink: #3b3416;
    --note-line: #e8d98a;
    --accent: #2f6b34;
    --accent-ink: #ffffff;
    --shadow: rgba(31, 50, 32, .22);
    --focus: #1a4a1f;
    --danger: #a33b2e;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17221a;
      --ink: #e4efdd;
      --ink-soft: #b3c7ab;
      --paper: #243328;
      --paper-ink: #e4efdd;
      --paper-soft: #a5bb9d;
      --paper-line: #334536;
      --note: #4a4526;
      --note-fold: #62592f;
      --note-ink: #f3ebc0;
      --note-line: #625b33;
      --accent: #8fd18a;
      --accent-ink: #12200f;
      --shadow: rgba(0, 0, 0, .45);
      --focus: #b9f0b4;
      --danger: #ff9d90;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17221a;
    --ink: #e4efdd;
    --ink-soft: #b3c7ab;
    --paper: #243328;
    --paper-ink: #e4efdd;
    --paper-soft: #a5bb9d;
    --paper-line: #334536;
    --note: #4a4526;
    --note-fold: #62592f;
    --note-ink: #f3ebc0;
    --note-line: #625b33;
    --accent: #8fd18a;
    --accent-ink: #12200f;
    --shadow: rgba(0, 0, 0, .45);
    --focus: #b9f0b4;
      --danger: #ff9d90;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  h1, h2 { margin: 0; line-height: 1.3; }
  ul { list-style: none; margin: 0; padding: 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .app { max-width: 960px; margin: 0 auto; padding: 20px 16px 56px; }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .5em;
    padding: .6rem 1.5rem;
    border-radius: 999px;
    border: 2px solid var(--paper-ink);
    background: var(--paper);
    color: var(--paper-ink);
    font-weight: 700;
    transition: transform .12s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn svg { width: 1.1em; height: 1.1em; flex: none; }

  /* ---------- home layout ---------- */
  .home {
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
    gap: 20px 24px;
    align-items: start;
  }
  .col { display: flex; flex-direction: column; gap: 20px; }
  @media (max-width: 760px) {
    .home { display: flex; flex-direction: column; }
    .col { display: contents; }
    .clock-card { order: 1; }
    .note-wrap { order: 2; }
    .diary { order: 3; }
    .btn-row { order: 4; }
  }


  /* ---------- clock ---------- */
  .clock-card {
    align-self: start;
    width: max-content;
    max-width: 100%;
    background: var(--paper);
    color: var(--paper-ink);
    border: 2px solid var(--paper-ink);
    border-radius: 14px;
    padding: 10px 22px 12px;
    box-shadow: 0 6px 14px -6px var(--shadow);
  }
  .clock-card .date { font-weight: 700; font-size: .95rem; }
  .clock-card .time {
    font-family: "DotGothic16", "Zen Maru Gothic", monospace;
    font-size: 2.5rem; line-height: 1.15;
    letter-spacing: .14em;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- diary ---------- */
  .diary {
    background: var(--paper);
    color: var(--paper-ink);
    border: 2px solid var(--paper-ink);
    border-radius: 30px;
    padding: 18px 22px 20px;
    box-shadow: 0 8px 18px -8px var(--shadow);
  }
  .diary-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .diary-head h2 { font-size: 1.05rem; }
  .status { font-size: .85rem; color: var(--paper-soft); }
  .status.is-dirty { color: var(--paper-ink); font-weight: 700; }
  .diary textarea {
    display: block; width: 100%;
    min-height: 15rem;
    resize: vertical;
    border: 0; outline: 0;
    background-color: transparent;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(2rem - 1px), var(--paper-line) calc(2rem - 1px), var(--paper-line) 2rem);
    background-attachment: local;
    line-height: 2rem;
    padding: 0;
    color: var(--paper-ink);
  }
  .diary textarea::placeholder { color: var(--paper-soft); opacity: .8; }
  .diary textarea:focus-visible { outline: 0; }
  .diary:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
  .actions { display: flex; justify-content: center; gap: 12px; margin-top: 14px; }
  .actions .btn { min-width: 7.5rem; padding-block: .45rem; font-size: .95rem; }

  /* ---------- todo note ---------- */
  .note-wrap { filter: drop-shadow(0 8px 10px var(--shadow)); }
  .note {
    position: relative;
    background: var(--note);
    color: var(--note-ink);
    padding: 16px 18px 14px;
    clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 30px, 100% 100%, 0 100%);
  }
  .note::after {
    content: ""; position: absolute; top: 0; right: 0; width: 30px; height: 30px;
    background: linear-gradient(225deg, transparent 50%, var(--note-fold) 50%);
  }
  .note h2 { font-size: 1.05rem; margin-bottom: 10px; }
  .todo-add { display: flex; gap: 8px; margin-bottom: 8px; }
  .todo-add input {
    flex: 1; min-width: 0;
    padding: .45rem .7rem;
    border: 2px solid var(--note-ink);
    border-radius: 10px;
    background: transparent;
    color: var(--note-ink);
  }
  .todo-add input::placeholder { color: var(--note-ink); opacity: .6; }
  .todo-add button {
    padding: .35rem 1rem; border-radius: 10px; font-weight: 700;
    border: 2px solid var(--note-ink); background: var(--note-ink); color: var(--note);
  }
  #todo-list li { display: flex; align-items: center; border-bottom: 1px dashed var(--note-line); }
  .todo-main {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 10px;
    padding: .5rem .1rem;
    background: none; border: 0; text-align: left;
    color: var(--note-ink);
  }
  .box {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--note-ink);
    display: grid; place-items: center;
    transition: background .12s ease;
  }
  .box svg { width: 14px; height: 14px; opacity: 0; stroke: var(--note); }
  .todo-main[aria-pressed="true"] .box { background: var(--note-ink); }
  .todo-main[aria-pressed="true"] .box svg { opacity: 1; }
  .todo-main[aria-pressed="true"] .txt { text-decoration: line-through; opacity: .6; }
  .txt { overflow-wrap: anywhere; }
  .del {
    flex: none; width: 32px; height: 32px; border-radius: 8px;
    background: none; border: 0; color: var(--note-ink); opacity: .6;
    display: grid; place-items: center;
  }
  .del:hover { opacity: 1; }
  .del svg { width: 16px; height: 16px; }
  .todo-foot { display: flex; align-items: center; gap: 10px; padding-top: 12px; font-size: .9rem; min-height: 2.6rem; }
  .todo-foot svg { width: 30px; height: 30px; flex: none; }
  .todo-foot .done-msg { font-weight: 700; font-size: 1.1rem; }

  .btn-row { align-self: center; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

  /* ---------- sub pages ---------- */
  .bar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; margin-bottom: 22px; }
  .bar h1 { font-size: 1.35rem; text-align: center; }
  .bar-extra { display: flex; gap: 6px; min-width: 40px; justify-content: flex-end; }
  .back {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--paper); color: var(--paper-ink);
    border: 2px solid var(--paper-ink); border-radius: 999px;
    padding: .3rem 1rem .3rem .6rem; font-weight: 700; font-size: .95rem;
  }
  .back svg { width: 1.2em; height: 1.2em; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--paper); color: var(--paper-ink); border: 2px solid var(--paper-ink);
  }
  .icon-btn svg { width: 20px; height: 20px; }

  .months { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 520px) { .months { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .month {
    text-align: left;
    background: var(--paper); color: var(--paper-ink);
    border: 2px solid var(--paper-ink); border-radius: 16px;
    padding: 14px 16px;
    box-shadow: 0 6px 12px -8px var(--shadow);
  }
  .month strong { display: block; font-size: 1.35rem; line-height: 1.2; }
  .month span { font-size: .85rem; color: var(--paper-soft); }
  .month.is-now { border-width: 4px; padding: 12px 14px; }
  .month.has { background: var(--paper); }

  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .cal .wd { text-align: center; font-size: .85rem; font-weight: 700; color: var(--ink); padding-bottom: 2px; }
  .day {
    min-height: 54px; padding: 6px 0 4px;
    background: var(--paper); color: var(--paper-ink);
    border: 2px solid transparent; border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  }
  .day .n { font-size: 1rem; line-height: 1.2; }
  .day .dot { width: 8px; height: 8px; border-radius: 50%; border: 2px solid transparent; }
  .day.has .n { font-weight: 700; }
  .day.has .dot { background: var(--accent); border-color: var(--accent); }
  .day.draft .dot { background: transparent; border-color: var(--accent); }
  .day.today { border-color: var(--paper-ink); }
  .cal .blank { visibility: hidden; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 12px 2px 0; font-size: .85rem; color: var(--ink); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent); display: inline-block; }
  .legend i.f { background: var(--accent); }

  .entries { margin-top: 26px; }
  .entries h2 { font-size: 1.05rem; margin-bottom: 10px; }
  .entry-row {
    display: flex; align-items: center; gap: 14px; width: 100%;
    text-align: left; margin-bottom: 8px;
    background: var(--paper); color: var(--paper-ink);
    border: 2px solid var(--paper-ink); border-radius: 14px;
    padding: 10px 14px;
  }
  .entry-row .d { flex: none; font-weight: 700; min-width: 4.6em; }
  .entry-row .p { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--paper-soft); }
  .badge { flex: none; font-size: .78rem; font-weight: 700; padding: .05rem .6rem; border: 2px solid var(--accent); border-radius: 999px; color: var(--accent); }
  .empty { background: var(--paper); color: var(--paper-ink); border-radius: 14px; padding: 16px 18px; border: 2px dashed var(--paper-ink); }

  .past-todo { margin-top: 20px; background: var(--paper); color: var(--paper-ink); border: 2px solid var(--paper-ink); border-radius: 18px; padding: 14px 18px; }
  .past-todo h2 { font-size: 1rem; margin-bottom: 6px; }
  .past-todo li { display: flex; gap: 10px; align-items: baseline; padding: 2px 0; }
  .past-todo li.done .t { text-decoration: line-through; color: var(--paper-soft); }
  .past-todo .m { width: 1.2em; text-align: center; flex: none; font-weight: 700; }


  /* ---------- backup ---------- */
  .backup {
    margin-top: 32px;
    background: var(--paper); color: var(--paper-ink);
    border: 2px dashed var(--paper-ink); border-radius: 18px;
    padding: 16px 20px 18px;
  }
  .backup h2 { font-size: 1rem; }
  .backup p { margin: 4px 0 0; font-size: .88rem; color: var(--paper-soft); }
  .backup .last { font-weight: 700; color: var(--paper-ink); }
  .backup-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .backup-actions .btn { padding: .4rem 1.1rem; font-size: .9rem; }
  label.btn:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
  .backup textarea {
    display: block; width: 100%; height: 9rem; margin-top: 12px;
    background: transparent; color: var(--paper-ink);
    border: 2px solid var(--paper-ink); border-radius: 10px; padding: 8px 10px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem;
  }

  /* ---------- timeline ---------- */
  .field {
    display: block; width: 100%;
    padding: .5rem .75rem;
    border: 2px solid var(--paper-ink); border-radius: 10px;
    background: transparent; color: var(--paper-ink);
  }
  .field::placeholder { color: var(--paper-soft); opacity: .8; }
  .gate, .composer {
    background: var(--paper); color: var(--paper-ink);
    border: 2px solid var(--paper-ink); border-radius: 20px;
    padding: 18px 20px 20px;
    box-shadow: 0 8px 18px -8px var(--shadow);
  }
  .gate { max-width: 460px; margin: 0 auto; }
  .gate h2, .composer h2 { font-size: 1.05rem; margin-bottom: 6px; }
  .gate p, .composer .hint { margin: 0 0 12px; font-size: .88rem; color: var(--paper-soft); }
  .gate .btn { margin-top: 12px; }
  .form-err { margin: 8px 0 0; min-height: 1.4em; font-size: .88rem; font-weight: 700; color: var(--danger); }
  .composer .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .composer .row .field { max-width: 15rem; }
  .composer textarea.field { min-height: 6.5rem; resize: vertical; line-height: 1.6; }
  .composer .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
  .composer .count { font-size: .85rem; color: var(--paper-soft); }
  .composer .btn { padding-block: .4rem; }
  .composer .btn:disabled { opacity: .6; cursor: default; }
  .feed {
    margin-top: 20px;
    background: var(--paper); color: var(--paper-ink);
    border: 2px solid var(--paper-ink); border-radius: 20px; overflow: hidden;
  }
  .post { display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--paper-line); }
  .post:last-child { border-bottom: 0; }
  .avatar {
    flex: none; width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 700; color: #1f3220; border: 2px solid var(--paper-ink);
  }
  .avatar.c0 { background: #ffd93b; } .avatar.c1 { background: #f4a6a0; } .avatar.c2 { background: #a9d6f5; }
  .avatar.c3 { background: #c9b6f0; } .avatar.c4 { background: #9cc58a; }
  .post-main { flex: 1; min-width: 0; }
  .post-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .post-name { overflow-wrap: anywhere; }
  .post-head time { font-size: .82rem; color: var(--paper-soft); }
  .tl-del {
    margin-left: auto; font-size: .82rem; font-weight: 700;
    background: none; border: 0; padding: .1rem .4rem; border-radius: 6px;
    color: var(--paper-soft);
  }
  .tl-del:hover, .tl-del.armed { color: var(--danger); }
  .post-body { margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .tl-note { text-align: center; margin: 18px 0; }
  .tl-more { display: flex; justify-content: center; margin-top: 16px; }
  .tl-foot { margin-top: 26px; text-align: center; font-size: .85rem; }
  .tl-foot button { background: none; border: 0; text-decoration: underline; color: var(--ink); padding: .3rem; }
  .icon-btn:disabled { opacity: .55; cursor: default; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 20px);
    background: var(--ink); color: var(--bg);
    padding: .55rem 1.2rem; border-radius: 999px; font-weight: 700; font-size: .92rem;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main class="app" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ---------- helpers ---------- */
  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  function pad(n) { return String(n).padStart(2, '0'); }
  function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseKey(k) { var p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function labelOf(k) { var d = parseKey(k); return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + '【' + WD[d.getDay()] + '】'; }
  function shiftDay(k, n) { var d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); }
  function fmtTime(ts) { var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function $(sel) { return document.querySelector(sel); }

  var ICON = {
    left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
    right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
    list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>',
    refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>',
    people: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.4 3-5 6-5s5.4 1.6 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.2c2.4 0 4.1 1.3 4.5 4.3"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
  };

  function face(mode) {
    var mouth = mode === 2
      ? '<path d="M8.5 16.5h11c-.5 3.6-2.6 5.2-5.5 5.2s-5-1.6-5.5-5.2z" fill="#7a3b00" stroke="#7a3b00" stroke-width="1" stroke-linejoin="round"/>'
      : mode === 1
        ? '<path d="M9.5 17c1.5 2.6 7.5 2.6 9 0" fill="none" stroke="#5a4200" stroke-width="1.8" stroke-linecap="round"/>'
        : '<path d="M10 18.5h8" fill="none" stroke="#5a4200" stroke-width="1.8" stroke-linecap="round"/>';
    return '<svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="#ffd93b" stroke="#7a5b00" stroke-width="1.5"/><circle cx="10" cy="11" r="1.7" fill="#4a3600"/><circle cx="18" cy="11" r="1.7" fill="#4a3600"/>' + mouth + '</svg>';
  }

  /* ---------- storage ---------- */
  var KEY = 'hibi-note:v1';
  var store = { todos: {}, diary: {}, meta: {} };
  var warnedSave = false;

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var p = JSON.parse(raw);
        store = { todos: p.todos || {}, diary: p.diary || {}, meta: p.meta || {} };
      }
    } catch (e) { /* start empty */ }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(store)); }
    catch (e) {
      if (!warnedSave) { warnedSave = true; toast('このブラウザでは保存できません。ページを閉じると内容が消えます。', 4500); }
    }
  }

  var toastTimer = null;
  function toast(msg, ms) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, ms || 2000);
  }

  /* ---------- state ---------- */
  var $app = $('#app');
  var today = keyOf(new Date());
  var view = { name: 'home' };
  var editorDate = null;
  var dirty = false;

  function entryOf(k) { return store.diary[k] || null; }
  function todosOf(k) { return store.todos[k] || []; }

  /* ---------- diary editor ---------- */
  function editorHTML() {
    return '<section class="diary" aria-labelledby="diary-h">' +
      '<div class="diary-head"><h2 id="diary-h">日記</h2><span class="status" id="status"></span></div>' +
      '<textarea id="diary-text" placeholder="今日はどんな一日でしたか?" aria-label="日記の本文"></textarea>' +
      '<div class="actions"><button class="btn" id="btn-draft" type="button">一時保存</button>' +
      '<button class="btn primary" id="btn-post" type="button">投稿</button></div>' +
      '</section>';
  }

  function updateStatus() {
    var el = $('#status');
    if (!el || !editorDate) return;
    var e = entryOf(editorDate);
    var txt;
    if (dirty) txt = '未保存の変更があります';
    else if (!e) txt = 'まだ書いていません';
    else if (e.status === 'posted') txt = '投稿済み(' + fmtTime(e.updated) + ')';
    else txt = '下書き(' + fmtTime(e.updated) + 'に保存)';
    el.textContent = txt;
    el.classList.toggle('is-dirty', dirty);
  }

  function bindEditor(k) {
    editorDate = k;
    dirty = false;
    var ta = $('#diary-text');
    var e = entryOf(k);
    ta.value = e ? e.text : '';
    updateStatus();
    ta.addEventListener('input', function () {
      var cur = entryOf(k);
      dirty = ta.value !== (cur ? cur.text : '');
      updateStatus();
    });
    $('#btn-draft').addEventListener('click', function () { saveEntry('draft'); });
    $('#btn-post').addEventListener('click', function () { saveEntry('posted'); });
  }

  function saveEntry(status) {
    var ta = $('#diary-text');
    if (!ta.value.trim()) { toast('日記が空です。書いてから保存してください。'); ta.focus(); return; }
    store.diary[editorDate] = { text: ta.value, status: status, updated: Date.now() };
    save();
    dirty = false;
    updateStatus();
    toast(status === 'posted' ? '投稿しました' : '一時保存しました');
  }

  // Unsaved text is kept as a draft when leaving the page/view.
  function commitIfDirty(announce) {
    if (!editorDate || !dirty) return;
    var ta = $('#diary-text');
    if (ta && ta.value.trim()) {
      store.diary[editorDate] = { text: ta.value, status: 'draft', updated: Date.now() };
      save();
      if (announce) toast('書きかけを下書きとして保存しました');
    }
    dirty = false;
    updateStatus();
  }

  /* ---------- todo ---------- */
  function renderTodo() {
    var list = $('#todo-list');
    var foot = $('#todo-foot');
    if (!list) return;
    var ts = todosOf(today);
    list.innerHTML = ts.map(function (t) {
      return '<li data-id="' + t.id + '">' +
        '<button class="todo-main" type="button" aria-pressed="' + (t.done ? 'true' : 'false') + '">' +
        '<span class="box">' + ICON.check + '</span><span class="txt">' + esc(t.text) + '</span></button>' +
        '<button class="del" type="button" aria-label="「' + esc(t.text) + '」を削除">' + ICON.x + '</button></li>';
    }).join('');
    var done = ts.filter(function (t) { return t.done; }).length;
    if (!ts.length) foot.innerHTML = face(0) + '<span>今日のやることを追加しましょう</span>';
    else if (done === ts.length) foot.innerHTML = face(2) + '<span class="done-msg">完了!</span>';
    else foot.innerHTML = face(1) + '<span>' + done + ' / ' + ts.length + ' 完了</span>';
  }

  function addTodo(text) {
    var t = text.trim();
    if (!t) return;
    if (!store.todos[today]) store.todos[today] = [];
    store.todos[today].push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text: t, done: false });
    save();
    renderTodo();
  }

  function bindTodo() {
    var inp = $('#todo-input');
    function add() { addTodo(inp.value); inp.value = ''; inp.focus(); }
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); add(); }
    });
    $('#todo-add').addEventListener('click', add);
    $('#todo-list').addEventListener('click', function (e) {
      var li = e.target.closest('li');
      if (!li) return;
      var ts = todosOf(today);
      var idx = ts.findIndex(function (t) { return t.id === li.dataset.id; });
      if (idx < 0) return;
      if (e.target.closest('.del')) { ts.splice(idx, 1); save(); renderTodo(); }
      else if (e.target.closest('.todo-main')) { ts[idx].done = !ts[idx].done; save(); renderTodo(); }
    });
  }

  /* ---------- backup ---------- */
  function lastBackupText() {
    var t = store.meta && store.meta.lastBackup;
    return t ? '最後のバックアップ: ' + labelOf(keyOf(new Date(t))) + ' ' + fmtTime(t) : 'まだバックアップしていません';
  }

  function backupHTML() {
    return '<section class="backup" aria-labelledby="bk-h">' +
      '<h2 id="bk-h">バックアップ</h2>' +
      '<p>データはこのブラウザの中にだけ保存されています。ときどき書き出しておくと、消えても元に戻せます。</p>' +
      '<p class="last" id="bk-last">' + lastBackupText() + '</p>' +
      '<div class="backup-actions">' +
        '<button class="btn" id="bk-json" type="button">復元用に書き出す(JSON)</button>' +
        '<button class="btn" id="bk-text" type="button">読む用に書き出す(テキスト)</button>' +
        '<label class="btn" for="bk-file">バックアップを読み込む</label>' +
        '<input class="sr-only" id="bk-file" type="file" accept=".json,application/json">' +
      '</div>' +
      '<div id="bk-fallback"></div>' +
    '</section>';
  }

  function buildText() {
    var keys = Object.keys(store.diary).sort();
    return keys.map(function (k) {
      var e = store.diary[k];
      var head = '■ ' + labelOf(k) + (e.status === 'draft' ? '(下書き)' : '');
      var ts = todosOf(k);
      var todo = ts.length ? '\n[Todo] ' + ts.map(function (t) { return (t.done ? '✓' : '○') + t.text; }).join(' / ') : '';
      return head + todo + '\n\n' + e.text.replace(/\s+$/, '');
    }).join('\n\n----------------------------------------\n\n') + '\n';
  }

  async function exportFile(kind) {
    commitIfDirty(false);
    var data, name, mime;
    if (kind === 'json') {
      data = JSON.stringify({ app: 'hibi-note', version: 1, exportedAt: Date.now(), todos: store.todos, diary: store.diary }, null, 2);
      name = 'hibi-note-backup-' + today + '.json';
      mime = 'application/json';
    } else {
      if (!Object.keys(store.diary).length) { toast('書き出せる日記がまだありません'); return; }
      data = buildText();
      name = 'hibi-note-diary-' + today + '.txt';
      mime = 'text/plain';
    }
    try {
      var blob = new Blob([data], { type: mime + ';charset=utf-8' });
      var file = null;
      try { file = new File([blob], name, { type: mime }); } catch (e) { file = null; }
      var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      if (touch && file && navigator.canShare && navigator.canShare({ files: [file] })) {
        // Phones/tablets: the share sheet offers "Save to Files", which also works from the home-screen app.
        await navigator.share({ files: [file], title: name });
      } else {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
      }
      if (kind === 'json') {
        store.meta.lastBackup = Date.now();
        save();
        var el = $('#bk-last');
        if (el) el.textContent = lastBackupText();
      }
      toast('書き出しました');
    } catch (err) {
      if (err && err.name === 'AbortError') { toast('書き出しをキャンセルしました'); return; }
      showFallback(data, name);
    }
  }

  // Shown only when the browser could not save the file directly.
  function showFallback(data, name) {
    var box = $('#bk-fallback');
    if (!box) return;
    box.innerHTML = '<p>ファイルを直接保存できませんでした。下の内容をすべてコピーして、「' + esc(name) + '」という名前のファイルに貼り付けて保存してください。</p>' +
      '<textarea id="bk-copy" readonly aria-label="書き出した内容"></textarea>';
    var ta = $('#bk-copy');
    ta.value = data;
    ta.focus();
    ta.select();
  }

  function importText(str) {
    var msg = '読み込めませんでした。このアプリから書き出したバックアップ(JSON)を選んでください。';
    var p;
    try { p = JSON.parse(str); } catch (e) { toast(msg, 4000); return; }
    if (!p || p.app !== 'hibi-note' || !p.diary || typeof p.diary !== 'object' || !p.todos || typeof p.todos !== 'object') { toast(msg, 4000); return; }
    commitIfDirty(false);
    var re = /^\d{4}-\d{2}-\d{2}$/;
    var nd = 0, nt = 0;
    Object.keys(p.diary).forEach(function (k) {
      if (!re.test(k)) return;
      var e = p.diary[k];
      if (!e || typeof e.text !== 'string' || !e.text.trim()) return;
      var upd = Number(e.updated) || 0;
      var cur = store.diary[k];
      if (!cur || upd > (cur.updated || 0)) {
        store.diary[k] = { text: e.text, status: e.status === 'posted' ? 'posted' : 'draft', updated: upd };
        nd++;
      }
    });
    Object.keys(p.todos).forEach(function (k) {
      if (!re.test(k) || !Array.isArray(p.todos[k])) return;
      var cur = store.todos[k] || [];
      var ids = {};
      cur.forEach(function (t) { ids[t.id] = 1; });
      var added = false;
      p.todos[k].forEach(function (t) {
        if (!t || typeof t.text !== 'string' || !t.text.trim()) return;
        var id = (typeof t.id === 'string' && t.id) ? t.id : Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        if (ids[id]) return;
        ids[id] = 1;
        cur.push({ id: id, text: t.text.slice(0, 80), done: !!t.done });
        added = true;
      });
      if (added) { store.todos[k] = cur; nt++; }
    });
    save();
    render();
    if (nd || nt) toast('日記' + nd + '件、Todo' + nt + '日分を読み込みました', 3500);
    else toast('追加される内容はありませんでした(同じ内容か、より新しい内容がすでに入っています)', 4000);
  }

  function bindBackup() {
    $('#bk-json').addEventListener('click', function () { exportFile('json'); });
    $('#bk-text').addEventListener('click', function () { exportFile('text'); });
    $('#bk-file').addEventListener('change', function (ev) {
      var f = ev.target.files && ev.target.files[0];
      ev.target.value = '';
      if (!f) return;
      if (f.size > 20 * 1024 * 1024) { toast('ファイルが大きすぎます'); return; }
      var r = new FileReader();
      r.onload = function () { importText(String(r.result)); };
      r.onerror = function () { toast('ファイルを読み込めませんでした'); };
      r.readAsText(f);
    });
  }


  /* ---------- clock ---------- */
  function tick() {
    var now = new Date();
    var nk = keyOf(now);
    if (nk !== today) {
      commitIfDirty(true);
      today = nk;
      render();
      return;
    }
    var dl = $('#date-label'), tl = $('#time-label');
    if (dl) dl.textContent = labelOf(today);
    if (tl) tl.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
  }

  /* ---------- navigation ---------- */
  function go(v) {
    commitIfDirty(true);
    view = v;
    render();
    window.scrollTo(0, 0);
  }

  function barHTML(title, backLabel, extra) {
    return '<header class="bar"><button class="back" id="btn-back" type="button">' + ICON.left + '<span>' + backLabel + '</span></button>' +
      '<h1>' + esc(title) + '</h1><div class="bar-extra">' + (extra || '') + '</div></header>';
  }

  /* ---------- views ---------- */
  function renderHome() {
    $app.innerHTML =
      '<div class="home">' +
        '<div class="col">' +
          '<section class="clock-card" aria-label="現在の日時"><div class="date" id="date-label"></div><div class="time" id="time-label"></div></section>' +
          editorHTML() +
        '</div>' +
        '<div class="col">' +
          '<div class="note-wrap"><section class="note" aria-labelledby="todo-h">' +
            '<h2 id="todo-h">Todo</h2>' +
            '<div class="todo-add"><input id="todo-input" type="text" maxlength="80" placeholder="やることを入力" aria-label="やることを入力" autocomplete="off">' +
            '<button id="todo-add" type="button">追加</button></div>' +
            '<ul id="todo-list"></ul>' +
            '<div class="todo-foot" id="todo-foot"></div>' +
          '</section></div>' +
          '<div class="btn-row"><button class="btn" id="btn-list" type="button">' + ICON.list + '日記一覧</button>' +
          '<button class="btn" id="btn-tl" type="button">' + ICON.people + 'みんなの日記</button></div>' +
        '</div>' +
      '</div>' +
      backupHTML();
    bindEditor(today);
    bindTodo();
    renderTodo();
    bindBackup();
    tick();
    $('#btn-tl').addEventListener('click', function () { go({ name: 'timeline' }); });
    $('#btn-list').addEventListener('click', function () {
      var d = new Date();
      go({ name: 'months', year: d.getFullYear() });
    });
  }

  function renderMonths() {
    var y = view.year;
    var counts = new Array(12).fill(0);
    Object.keys(store.diary).forEach(function (k) {
      var d = parseKey(k);
      if (d.getFullYear() === y) counts[d.getMonth()]++;
    });
    var now = new Date();
    var nav = '<button class="icon-btn" id="y-prev" type="button" aria-label="前の年">' + ICON.left + '</button>' +
              '<button class="icon-btn" id="y-next" type="button" aria-label="次の年">' + ICON.right + '</button>';
    var cells = counts.map(function (c, i) {
      var isNow = (y === now.getFullYear() && i === now.getMonth());
      return '<button class="month' + (isNow ? ' is-now' : '') + '" type="button" data-m="' + i + '"' + (isNow ? ' aria-current="date"' : '') + '>' +
        '<strong>' + (i + 1) + '月</strong><span>' + (c ? c + '件' : '記録なし') + '</span></button>';
    }).join('');
    $app.innerHTML = barHTML(y + '年', 'ホーム', nav) + '<div class="months">' + cells + '</div>';
    $('#btn-back').addEventListener('click', function () { go({ name: 'home' }); });
    $('#y-prev').addEventListener('click', function () { go({ name: 'months', year: y - 1 }); });
    $('#y-next').addEventListener('click', function () { go({ name: 'months', year: y + 1 }); });
    $app.querySelectorAll('.month').forEach(function (b) {
      b.addEventListener('click', function () { go({ name: 'days', year: y, month: Number(b.dataset.m) }); });
    });
  }

  function renderDays() {
    var y = view.year, m = view.month;
    var prev = new Date(y, m - 1, 1), next = new Date(y, m + 1, 1);
    var nav = '<button class="icon-btn" id="m-prev" type="button" aria-label="前の月">' + ICON.left + '</button>' +
              '<button class="icon-btn" id="m-next" type="button" aria-label="次の月">' + ICON.right + '</button>';
    var dim = new Date(y, m + 1, 0).getDate();
    var startDow = new Date(y, m, 1).getDay();
    var html = WD.map(function (w) { return '<div class="wd" aria-hidden="true">' + w + '</div>'; }).join('');
    for (var i = 0; i < startDow; i++) html += '<div class="blank"></div>';
    var rows = [];
    for (var d = 1; d <= dim; d++) {
      var k = y + '-' + pad(m + 1) + '-' + pad(d);
      var e = entryOf(k);
      var cls = 'day' + (e ? ' has' + (e.status === 'draft' ? ' draft' : '') : '') + (k === today ? ' today' : '');
      var label = (m + 1) + '月' + d + '日' + (e ? (e.status === 'draft' ? '、下書きあり' : '、日記あり') : '');
      html += '<button class="' + cls + '" type="button" data-k="' + k + '" aria-label="' + label + '"><span class="n">' + d + '</span><span class="dot"></span></button>';
      if (e) rows.push({ k: k, d: d, e: e });
    }
    rows.reverse();
    var list = rows.length
      ? rows.map(function (r) {
          var first = r.e.text.split('\n').filter(function (s) { return s.trim(); })[0] || '';
          var wd = WD[parseKey(r.k).getDay()];
          return '<button class="entry-row" type="button" data-k="' + r.k + '"><span class="d">' + r.d + '日(' + wd + ')</span>' +
            '<span class="p">' + esc(first) + '</span>' + (r.e.status === 'draft' ? '<span class="badge">下書き</span>' : '') + '</button>';
        }).join('')
      : '<div class="empty">この月の日記はまだありません。カレンダーの日付を選ぶと書き始められます。</div>';

    $app.innerHTML = barHTML(y + '年' + (m + 1) + '月', '月の一覧', nav) +
      '<div class="cal">' + html + '</div>' +
      '<div class="legend"><span><i class="f"></i>投稿済み</span><span><i></i>下書き</span></div>' +
      '<section class="entries"><h2>この月の日記</h2>' + list + '</section>';
    $('#btn-back').addEventListener('click', function () { go({ name: 'months', year: y }); });
    $('#m-prev').addEventListener('click', function () { go({ name: 'days', year: prev.getFullYear(), month: prev.getMonth() }); });
    $('#m-next').addEventListener('click', function () { go({ name: 'days', year: next.getFullYear(), month: next.getMonth() }); });
    $app.querySelectorAll('[data-k]').forEach(function (b) {
      b.addEventListener('click', function () { go({ name: 'entry', date: b.dataset.k }); });
    });
  }

  function renderEntry() {
    var k = view.date;
    var d = parseKey(k);
    var nav = '<button class="icon-btn" id="d-prev" type="button" aria-label="前の日">' + ICON.left + '</button>' +
              '<button class="icon-btn" id="d-next" type="button" aria-label="次の日">' + ICON.right + '</button>';
    var html = barHTML(labelOf(k), '月の一覧', nav) + editorHTML();
    var ts = todosOf(k);
    if (ts.length && k !== today) {
      html += '<section class="past-todo" aria-labelledby="pt-h"><h2 id="pt-h">この日のTodo</h2><ul>' +
        ts.map(function (t) {
          return '<li class="' + (t.done ? 'done' : '') + '"><span class="m" aria-hidden="true">' + (t.done ? '✓' : '○') + '</span>' +
            '<span class="sr-only">' + (t.done ? '完了:' : '未完了:') + '</span><span class="t">' + esc(t.text) + '</span></li>';
        }).join('') + '</ul></section>';
    }
    $app.innerHTML = html;
    bindEditor(k);
    $('#btn-back').addEventListener('click', function () { go({ name: 'days', year: d.getFullYear(), month: d.getMonth() }); });
    $('#d-prev').addEventListener('click', function () { go({ name: 'entry', date: shiftDay(k, -1) }); });
    $('#d-next').addEventListener('click', function () { go({ name: 'entry', date: shiftDay(k, 1) }); });
  }

  function render() {
    editorDate = null;
    dirty = false;
    if (view.name === 'home') renderHome();
    else if (view.name === 'months') renderMonths();
    else if (view.name === 'days') renderDays();
    else if (view.name === 'timeline') renderTimeline();
    else renderEntry();
  }


  /* ---------- みんなの日記 (shared timeline via Supabase RPC) ---------- */
  var TL_KEY = 'hibi-note:timeline';
  var TL_PAGE = 30;
  var tl = { pass: '', name: '', key: '', posts: [], hasMore: false, loading: false, loaded: false, draft: '' };

  function randomKey() {
    var a = new Uint8Array(16);
    try { (window.crypto || window.msCrypto).getRandomValues(a); }
    catch (e) { for (var i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256); }
    return Array.prototype.map.call(a, function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }
  function tlSave() {
    try { localStorage.setItem(TL_KEY, JSON.stringify({ pass: tl.pass, name: tl.name, key: tl.key })); } catch (e) { /* ignore */ }
  }
  function tlLoad() {
    try {
      var raw = localStorage.getItem(TL_KEY);
      if (raw) { var p = JSON.parse(raw); tl.pass = p.pass || ''; tl.name = p.name || ''; tl.key = p.key || ''; }
    } catch (e) { /* ignore */ }
    if (!tl.key) { tl.key = randomKey(); tlSave(); }
  }
  function tlConfig() {
    var c = window.HIBI_CONFIG || {};
    var u = String(c.supabaseUrl || '').trim(), k = String(c.supabaseKey || '').trim();
    if (!u || !k) return null;
    return { url: u.replace(/\/+$/, ''), key: k };
  }

  async function rpc(fn, args) {
    var cfg = tlConfig();
    if (!cfg) return { ok: false, error: 'not_configured' };
    var headers = { 'Content-Type': 'application/json', 'apikey': cfg.key };
    if (/^eyJ/.test(cfg.key)) headers['Authorization'] = 'Bearer ' + cfg.key; // legacy JWT-style key
    var res;
    try { res = await fetch(cfg.url + '/rest/v1/rpc/' + fn, { method: 'POST', headers: headers, body: JSON.stringify(args) }); }
    catch (e) { return { ok: false, error: 'network' }; }
    if (!res.ok) return { ok: false, error: 'server' };
    try { return await res.json(); } catch (e) { return { ok: false, error: 'server' }; }
  }

  function tlErrText(code) {
    return ({
      bad_passphrase: '合言葉が違います。',
      too_many_attempts: '失敗が続いたため、しばらく待ってからもう一度お試しください。',
      rate_limited: '短時間に投稿しすぎです。少し待ってください。',
      invalid_input: 'お名前(20文字まで)と本文(1000文字まで)を入力してください。',
      network: 'つながりませんでした。通信状況を確認してください。',
      server: 'サーバーでエラーが起きました。設定(SQLの実行・URL・キー)を確認してください。',
      not_found: '見つかりませんでした。すでに削除されているかもしれません。'
    })[code] || 'うまくいきませんでした。もう一度お試しください。';
  }

  function avatarClass(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h + name.charCodeAt(i)) % 5;
    return 'c' + h;
  }
  function fmtPostTime(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var now = new Date();
    var hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
    if (keyOf(d) === keyOf(now)) return '今日 ' + hm;
    var md = (d.getMonth() + 1) + '/' + d.getDate();
    return (d.getFullYear() !== now.getFullYear() ? d.getFullYear() + '/' : '') + md + ' ' + hm;
  }

  function gateHTML() {
    return '<section class="gate" aria-labelledby="gate-h"><h2 id="gate-h">合言葉を入力</h2>' +
      '<p>この日記を見たり書いたりするには、合言葉が必要です。入力した合言葉は、この端末に保存されます。</p>' +
      '<input class="field" id="gate-pass" type="password" autocomplete="off" autocapitalize="off" aria-label="合言葉">' +
      '<button class="btn primary" id="gate-go" type="button">入る</button>' +
      '<p class="form-err" id="gate-err" role="alert"></p></section>';
  }

  function composerHTML() {
    return '<section class="composer" aria-labelledby="cmp-h"><h2 id="cmp-h">日記を書く</h2>' +
      '<p class="hint">ここに投稿した内容は、合言葉を知っている全員に見えます。自分用の日記帳(非公開)とは別のものです。</p>' +
      '<div class="row"><input class="field" id="tl-name" type="text" maxlength="20" placeholder="お名前(20文字まで)" aria-label="お名前" autocomplete="off"></div>' +
      '<textarea class="field" id="tl-text" maxlength="1000" placeholder="今日はどんな一日でしたか?" aria-label="日記の本文"></textarea>' +
      '<div class="foot"><span class="count" id="tl-count">0 / 1000</span>' +
      '<button class="btn primary" id="tl-post" type="button">投稿</button></div>' +
      '<p class="form-err" id="tl-err" role="alert"></p></section>';
  }

  function postHTML(p) {
    var name = String(p.author || '');
    var initial = Array.from(name)[0] || '?';
    return '<article class="post" data-id="' + esc(p.id) + '">' +
      '<div class="avatar ' + avatarClass(name) + '" aria-hidden="true">' + esc(initial) + '</div>' +
      '<div class="post-main"><div class="post-head"><strong class="post-name">' + esc(name) + '</strong>' +
      '<time datetime="' + esc(p.created_at) + '">' + fmtPostTime(p.created_at) + '</time>' +
      (p.mine ? '<button class="tl-del" type="button" aria-label="この投稿を削除">削除</button>' : '') +
      '</div><div class="post-body">' + esc(p.body) + '</div></div></article>';
  }

  function renderTlList() {
    var list = $('#tl-list'), more = $('#tl-more');
    if (!list) return;
    if (!tl.loaded) {
      list.innerHTML = '<p class="tl-note">読み込み中…</p>';
      more.innerHTML = '';
    } else if (!tl.posts.length) {
      list.innerHTML = '<div class="empty" style="margin-top:20px">まだ投稿がありません。最初の1件を書いてみましょう。</div>';
      more.innerHTML = '';
    } else {
      list.innerHTML = '<div class="feed">' + tl.posts.map(postHTML).join('') + '</div>';
      more.innerHTML = tl.hasMore ? '<div class="tl-more"><button class="btn" id="tl-more-btn" type="button">もっと見る</button></div>' : '';
    }
    var rb = $('#tl-refresh');
    if (rb) rb.disabled = tl.loading;
  }

  function tlHandleError(code) {
    if (code === 'bad_passphrase') {
      tl.pass = ''; tl.loaded = false; tl.posts = []; tlSave();
      renderTimeline();
      var ge = $('#gate-err');
      if (ge) ge.textContent = '合言葉が違うか、変更されています。もう一度入力してください。';
      return;
    }
    toast(tlErrText(code), 3500);
    var rb = $('#tl-refresh');
    if (rb) rb.disabled = false;
    if (!tl.loaded) { tl.loaded = true; renderTlList(); }
  }

  async function tlFetch(more) {
    if (tl.loading || !tl.pass) return;
    tl.loading = true;
    renderTlList();
    var before = more && tl.posts.length ? tl.posts[tl.posts.length - 1].created_at : null;
    var res = await rpc('hn_get_posts', { p_pass: tl.pass, p_key: tl.key, p_before: before, p_limit: TL_PAGE });
    tl.loading = false;
    if (!res || !res.ok) { tlHandleError(res && res.error); return; }
    var got = res.posts || [];
    if (more) {
      tl.posts = tl.posts.concat(got);
      tl.hasMore = got.length === TL_PAGE;
    } else if (got.length < TL_PAGE) {
      tl.posts = got;
      tl.hasMore = false;
    } else {
      var ids = {};
      got.forEach(function (p) { ids[p.id] = 1; });
      var oldest = Date.parse(got[got.length - 1].created_at);
      var keep = tl.posts.filter(function (p) { return !ids[p.id] && Date.parse(p.created_at) <= oldest; });
      tl.posts = got.concat(keep);
      tl.hasMore = keep.length ? tl.hasMore : true;
    }
    tl.loaded = true;
    if (view.name === 'timeline') renderTlList();
  }

  async function tlEnter() {
    var inp = $('#gate-pass'), btn = $('#gate-go'), err = $('#gate-err');
    var pass = inp.value;
    if (!pass) { err.textContent = '合言葉を入力してください。'; inp.focus(); return; }
    btn.disabled = true;
    err.textContent = '';
    var res = await rpc('hn_get_posts', { p_pass: pass, p_key: tl.key, p_before: null, p_limit: TL_PAGE });
    btn.disabled = false;
    if (!res || !res.ok) { err.textContent = tlErrText(res && res.error); return; }
    tl.pass = pass; tlSave();
    tl.posts = res.posts || [];
    tl.hasMore = tl.posts.length === TL_PAGE;
    tl.loaded = true;
    renderTimeline();
  }

  async function tlPost() {
    var nameEl = $('#tl-name'), ta = $('#tl-text'), btn = $('#tl-post'), err = $('#tl-err');
    var name = nameEl.value.trim(), text = ta.value.trim();
    err.textContent = '';
    if (!name) { err.textContent = 'お名前を入力してください。'; nameEl.focus(); return; }
    if (!text) { err.textContent = '本文を入力してください。'; ta.focus(); return; }
    btn.disabled = true;
    var res = await rpc('hn_create_post', { p_pass: tl.pass, p_author: name, p_body: text, p_key: tl.key });
    btn.disabled = false;
    if (!res || !res.ok) {
      if (res && res.error === 'bad_passphrase') { tlHandleError('bad_passphrase'); return; }
      err.textContent = tlErrText(res && res.error);
      return;
    }
    tl.name = name; tlSave();
    ta.value = ''; tl.draft = '';
    $('#tl-count').textContent = '0 / 1000';
    toast('投稿しました');
    tlFetch(false);
  }

  async function tlDelete(id) {
    var res = await rpc('hn_delete_post', { p_pass: tl.pass, p_id: id, p_key: tl.key });
    if (!res || !res.ok) {
      if (res && res.error === 'bad_passphrase') { tlHandleError('bad_passphrase'); return; }
      toast(tlErrText(res && res.error), 3500);
      return;
    }
    tl.posts = tl.posts.filter(function (p) { return p.id !== id; });
    renderTlList();
    toast('削除しました');
  }

  function renderTimeline() {
    var ready = !!tlConfig();
    var authed = ready && !!tl.pass;
    var extra = authed ? '<button class="icon-btn" id="tl-refresh" type="button" aria-label="最新の状態に更新">' + ICON.refresh + '</button>' : '';
    var body;
    if (!ready) {
      body = '<div class="empty">まだ「みんなの日記」の接続先が設定されていません。<br>README の手順に沿って、<code>config.js</code> に Supabase の URL とキーを入力してください。</div>';
    } else if (!authed) {
      body = gateHTML();
    } else {
      body = composerHTML() + '<div id="tl-list"></div><div id="tl-more"></div>' +
        '<p class="tl-foot"><button id="tl-relogin" type="button">合言葉を入れ直す</button></p>';
    }
    $app.innerHTML = barHTML('みんなの日記', 'ホーム', extra) + body;
    $('#btn-back').addEventListener('click', function () { go({ name: 'home' }); });
    if (!ready) return;

    if (!authed) {
      var inp = $('#gate-pass');
      $('#gate-go').addEventListener('click', tlEnter);
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); tlEnter(); }
      });
      return;
    }

    var nameEl = $('#tl-name'), ta = $('#tl-text');
    nameEl.value = tl.name;
    ta.value = tl.draft;
    $('#tl-count').textContent = ta.value.length + ' / 1000';
    ta.addEventListener('input', function () {
      tl.draft = ta.value;
      $('#tl-count').textContent = ta.value.length + ' / 1000';
    });
    ta.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !e.isComposing) { e.preventDefault(); tlPost(); }
    });
    $('#tl-post').addEventListener('click', tlPost);
    $('#tl-refresh').addEventListener('click', function () { tlFetch(false); });
    $('#tl-relogin').addEventListener('click', function () {
      tl.pass = ''; tl.loaded = false; tl.posts = []; tlSave();
      renderTimeline();
    });
    $('#tl-more').addEventListener('click', function (e) {
      if (e.target.closest('#tl-more-btn')) tlFetch(true);
    });
    $('#tl-list').addEventListener('click', function (e) {
      var del = e.target.closest('.tl-del');
      if (!del) return;
      var post = del.closest('.post');
      if (del.classList.contains('armed')) { tlDelete(post.dataset.id); return; }
      del.classList.add('armed');
      del.textContent = '本当に削除';
      setTimeout(function () { if (del.isConnected) { del.classList.remove('armed'); del.textContent = '削除'; } }, 4000);
    });
    renderTlList();
    tlFetch(false);
  }

  /* ---------- boot ---------- */
  load();
  tlLoad();
  render();
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) commitIfDirty(false);
    else if (view.name === 'timeline' && tl.pass) tlFetch(false);
  });
  setInterval(function () {
    if (view.name === 'timeline' && tl.pass && !document.hidden) tlFetch(false);
  }, 30000);
  window.addEventListener('pagehide', function () { commitIfDirty(false); });

  // Ask the browser not to evict our data when storage runs low.
  if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }
  // Offline support + installable app.
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
